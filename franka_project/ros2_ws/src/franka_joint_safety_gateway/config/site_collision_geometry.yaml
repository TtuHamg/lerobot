# SAFETY PLACEHOLDERS ONLY. Measure every pose/dimension at the installation,
# then set enabled and measurements_confirmed true. Until every required object
# is confirmed, the publisher intentionally emits no scene and arming fails.
scene_name: franka-site-measured
frame_id: base
planning_scene_topic: /monitored_planning_scene
required_objects: [table, fixture, camera, robotiq_body]

objects:
  - id: table
    enabled: false
    measurements_confirmed: false
    type: box
    dimensions: [1.20, 0.80, 0.05]
    pose: [0.45, 0.0, -0.025, 0.0, 0.0, 0.0, 1.0]

  - id: fixture
    enabled: false
    measurements_confirmed: false
    type: box
    dimensions: [0.20, 0.20, 0.10]
    pose: [0.50, 0.0, 0.05, 0.0, 0.0, 0.0, 1.0]

  - id: camera
    enabled: false
    measurements_confirmed: false
    type: box
    dimensions: [0.12, 0.08, 0.08]
    pose: [0.60, -0.45, 0.55, 0.0, 0.0, 0.0, 1.0]

  # Disable this object when the selected robot_description already includes
  # an accurately measured Robotiq model. Pose is relative to fr3_link8.
  - id: robotiq_body
    enabled: false
    measurements_confirmed: false
    frame_id: fr3_link8
    attached_to: fr3_link8
    touch_links: [fr3_link8]
    type: box
    dimensions: [0.10, 0.10, 0.16]
    pose: [0.0, 0.0, 0.08, 0.0, 0.0, 0.0, 1.0]
