[build-system]
requires = ["setuptools>=71.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_franka_ros"
version = "0.2.0"
description = "Out-of-tree LeRobot Franka adapter with dry-run and non-actuating ROS2 interfaces"
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.5.2",
    "numpy>=2.0.0,<2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]
